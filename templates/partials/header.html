<header class="site-header">
    <div class="container">
        <div class="header-brand">
            <svg class="header-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <h1 class="header-title">Support Center</h1>
        </div>
        <nav class="header-nav">
            {% if user.is_authenticated %}
            <span class="header-user-name">Hello, {{ user.get_username }}</span>
            <form action="{% url 'logout' %}" method="post" class="header-logout-form">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary">Logout</button>
            </form>
            {% endif %}
        </nav>
    </div>
</header>
